<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Ana Beatriz Silva</title>
  <meta name="description" content="{{DESCRIPTION}}">

  <link rel="canonical" href="https://www.anabsilva.com/blog/{{SLUG}}.html" />

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://www.anabsilva.com/blog/{{SLUG}}.html">
  <meta property="og:title" content="{{TITLE}} — Ana Beatriz Silva">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="https://www.anabsilva.com/assets/images/og-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Ana Beatriz Silva — anabsilva.com">
  <meta property="article:published_time" content="{{DATE_ISO}}">
  <meta property="article:author" content="Ana Beatriz Silva">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} — Ana Beatriz Silva">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://www.anabsilva.com/assets/images/og-default.jpg">

  <!-- Favicon: real files at a stable URL so Google Search can crawl and show it -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicons/apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    rel="stylesheet">

  <!-- Blog styles -->
  <link rel="stylesheet" href="blog.css">

  <!-- Google Analytics: add your GA4 measurement ID below when ready.
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  -->

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{TITLE}}",
    "description": "{{DESCRIPTION}}",
    "datePublished": "{{DATE_ISO}}",
    "author": {
      "@type": "Person",
      "name": "Ana Beatriz Silva",
      "url": "https://www.anabsilva.com/"
    },
    "publisher": {
      "@type": "Person",
      "name": "Ana Beatriz Silva"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "https://www.anabsilva.com/blog/{{SLUG}}.html"
    }
  }
  </script>
</head>

<!--
  ✏️ PLACEHOLDERS TO REPLACE IN THIS FILE:

    {{TITLE}}         Post title, e.g. "Why I stopped trusting row counts"
    {{DESCRIPTION}}   One or two sentence summary (used by Google and by
                      link previews on LinkedIn and WhatsApp)
    {{SLUG}}          The filename without .html, e.g. "trusting-row-counts"
    {{DATE_ISO}}      Machine-readable date, e.g. 2026-10-15
    {{DATE_DISPLAY}}  Human-readable date, e.g. October 15, 2026
    {{READING_TIME}}  Whole number of minutes, e.g. 5
    {{CONTENT}}       The post body as HTML

  Body markup that blog.css already styles: <p>, <h2>, <h3>, <ul>, <ol>,
  <blockquote>, <code>, <pre><code>, <table>, and <figure> with <figcaption>.
-->

<body>

  <!-- ── NAV ──────────────────────────────────────────────── -->
  <nav aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-logo">Ana Beatriz Silva</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"
        aria-label="Toggle menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <ul class="nav-links" id="primary-nav">
        <li><a href="/">Home</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#certifications">Certifications</a></li>
        <li><a href="/portfolio/">Portfolio</a></li>
        <li><a href="/blog/" class="active">Blog</a></li>
        <li><a href="/#connect">Connect</a></li>
      </ul>
    </div>
  </nav>

  <!-- ── ARTICLE HEADER ───────────────────────────────────── -->
  <header class="article-header">
    <a href="/blog/" class="back-link reveal">← All posts</a>
    <h1 class="reveal reveal-delay-1">{{TITLE}}</h1>
    <div class="article-meta reveal reveal-delay-2">
      <time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>
      <span>{{READING_TIME}} min read</span>
    </div>
  </header>

  <!-- ── ARTICLE BODY ─────────────────────────────────────── -->
  <article class="article-body">

    {{CONTENT}}

  </article>

  <!-- ── FOOTER ───────────────────────────────────────────── -->
  <footer>
    <div class="footer-inner">
      <p class="footer-copy">
        <strong>Ana Beatriz Silva</strong> · Data Analyst, Ireland
      </p>
      <a class="footer-rss" href="/blog/feed.xml">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M4 11a9 9 0 0 1 9 9h2.8A11.8 11.8 0 0 0 4 8.2zm0 5.2A2.8 2.8 0 1 0 6.8 19 2.8 2.8 0 0 0 4 16.2zM4 4a16 16 0 0 1 16 16h2.8A18.8 18.8 0 0 0 4 1.2z" />
        </svg>
        RSS feed
      </a>
    </div>
  </footer>

  <!-- ── SCROLL REVEAL ────────────────────────────────────── -->
  <script>
    (function () {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.reveal').forEach(function (el) {
        observer.observe(el);
      });
    })();
  </script>

  <!-- ── MOBILE NAV TOGGLE ────────────────────────────────── -->
  <script>
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var links = document.getElementById('primary-nav');
      if (!toggle || !links) return;

      function closeMenu() {
        links.classList.remove('is-open');
        toggle.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }

      toggle.addEventListener('click', function () {
        var isOpen = links.classList.toggle('is-open');
        toggle.classList.toggle('is-open', isOpen);
        toggle.setAttribute('aria-expanded', String(isOpen));
      });

      links.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', closeMenu);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && links.classList.contains('is-open')) {
          closeMenu();
          toggle.focus();
        }
      });

      window.addEventListener('resize', function () {
        if (window.innerWidth > 860) closeMenu();
      });
    })();
  </script>

</body>

</html>
